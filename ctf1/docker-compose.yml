# ============================================================
# CTF UCC - Lab 1: Ibague Data Services (IDS)
# Pensado para correr en una VM independiente (sin scoreboard).
# Levantar con:  docker compose up -d --build
# Acceso web:    http://<ip-vm>:8080
# Acceso SSH:    ssh admin@<ip-vm> -p 2222   (password: password123)
# ============================================================
services:
  web_app:
    image: php:8.2-apache
    container_name: ctf1_web_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./servidor_web:/var/www/html
    environment:
      DB_HOST: db_ssh
      DB_PORT: "3306"
      DB_USER: ctf_web
      DB_PASS: ctf_web_pass
      DB_ADMIN_USER: ctf_admin
      DB_ADMIN_PASS: ctf_admin_pass
      DB_NAME: ctf_login
      # URL publica del scoreboard (debe correr en UNA sola VM, ver scoreboard/).
      # Cambiar por la IP/host real, ej: http://10.0.0.50:9000
      SCOREBOARD_URL: ${SCOREBOARD_URL:-}
    depends_on:
      - db_ssh
    networks:
      - ctf1_net
    command: >
      bash -c "apt-get update && apt-get install -y --no-install-recommends iputils-ping traceroute dnsutils && rm -rf /var/lib/apt/lists/* && docker-php-ext-install mysqli && apache2-foreground"

  db_ssh:
    build:
      context: ./mysql_ssh
      dockerfile: Dockerfile
    container_name: ctf1_db_ssh
    restart: unless-stopped
    ports:
      - "2222:22"
    networks:
      - ctf1_net

networks:
  ctf1_net:
    driver: bridge
    name: ctf1_net
