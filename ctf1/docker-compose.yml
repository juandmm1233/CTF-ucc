# ============================================================
# CTF UCC - Lab 1: Ibague Data Services (IDS)
# Pensado para correr en una VM independiente (sin scoreboard).
# Levantar con:  docker compose up -d --build
# Acceso web:    http://<ip-vm>:8080
# Acceso SSH:    ssh admin@<ip-vm> -p 2222   (password: password123)
# ============================================================
services:
  web_app:
    image: php:8.2-apache
    container_name: ctf1_web_app
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./servidor_web:/var/www/html
      - lab_runtime:/lab_runtime
    environment:
      DB_HOST: db_ssh
      DB_PORT: "3306"
      DB_USER: ctf_web
      DB_PASS: ctf_web_pass
      DB_ADMIN_USER: ctf_admin
      DB_ADMIN_PASS: ctf_admin_pass
      DB_NAME: ctf_login
      # URL del scoreboard en el LXC, ej: http://10.0.0.50:9000
      # LAB_SYNC_TOKEN es el mismo valor que en scoreboard/secrets.env
      SCOREBOARD_URL: ${SCOREBOARD_URL:-}
      LAB_ID: ids
      LAB_SYNC_TOKEN: ${LAB_SYNC_TOKEN:-}
    depends_on:
      - db_ssh
    networks:
      - ctf1_net
    command: >
      bash -c "apt-get update && apt-get install -y --no-install-recommends iputils-ping traceroute dnsutils && rm -rf /var/lib/apt/lists/* && docker-php-ext-install mysqli && echo 'auto_prepend_file=/var/www/html/includes/exercise_gate.php' > /usr/local/etc/php/conf.d/zz-exercise.ini && mkdir -p /lab_runtime /var/ctf-private && { while true; do php /var/www/html/includes/sync_exercise.php || true; sleep 3; done & } && exec apache2-foreground"

  db_ssh:
    build:
      context: ./mysql_ssh
      dockerfile: Dockerfile
    container_name: ctf1_db_ssh
    restart: unless-stopped
    ports:
      - "2222:22"
    volumes:
      - lab_runtime:/lab_runtime
    networks:
      - ctf1_net

volumes:
  lab_runtime:

networks:
  ctf1_net:
    driver: bridge
    name: ctf1_net
