# ============================================================
# CTF UCC - Scoreboard 15 vs 15
# IMPORTANTE: este servicio corre en UN solo LXC.
# Si lo levantan dos veces, cada copia tendra su propio marcador.
#
# En Proxmox el LXC necesita nesting para ejecutar Docker.
#
# Levantar:    docker compose up -d --build
# Acceso web:  http://<ip-lxc>:9000
# secrets.env: SCOREBOARD_RESET_PASSWORD y LAB_SYNC_TOKEN
# En cada VM de CTF, antes de levantar el lab:
#                export SCOREBOARD_URL=http://<ip-lxc>:9000
#                export LAB_SYNC_TOKEN=<el mismo valor que en secrets.env>
#                docker compose up -d --build
# ============================================================
services:
  scoreboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ctf_scoreboard
    restart: unless-stopped
    ports:
      - "9000:5000"
    volumes:
      - scoreboard_data:/data
    # secrets.env inyecta SCOREBOARD_RESET_PASSWORD y LAB_SYNC_TOKEN
    # (no se copia en la imagen, no se sirve por HTTP).
    env_file:
      - ./secrets.env
    networks:
      - ctf_scoreboard_net

volumes:
  scoreboard_data:

networks:
  ctf_scoreboard_net:
    driver: bridge
    name: ctf_scoreboard_net
