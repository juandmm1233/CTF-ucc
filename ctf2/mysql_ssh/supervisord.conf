[program:mysqld-init]
command=/usr/local/bin/init.sh
autostart=true
autorestart=false
startsecs=0
priority=5
stdout_logfile=/var/log/supervisor/init.stdout.log
stderr_logfile=/var/log/supervisor/init.stderr.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:mariadb]
command=/usr/sbin/mariadbd --user=mysql --bind-address=0.0.0.0
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/mariadb.stdout.log
stderr_logfile=/var/log/supervisor/mariadb.stderr.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:sshd]
command=/usr/sbin/sshd -D -e
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/sshd.stdout.log
stderr_logfile=/var/log/supervisor/sshd.stderr.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
