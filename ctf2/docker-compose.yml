services:
  web_app:
    image: php:8.2-apache
    container_name: ctf2_web_app
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./servidor_web:/var/www/html
    environment:
      DB_HOST: db_ssh
      DB_PORT: "3306"
      DB_USER: ctf_web
      DB_PASS: ctf_web_pass
      DB_ADMIN_USER: ctf_admin
      DB_ADMIN_PASS: ctf_admin_pass
      DB_NAME: ctf_login
    depends_on:
      - db_ssh
    networks:
      - ctf_net2
    command: >
      bash -c "docker-php-ext-install mysqli && apache2-foreground"

  db_ssh:
    build:
      context: ./mysql_ssh
      dockerfile: Dockerfile
    container_name: ctf2_db_ssh
    restart: unless-stopped
    ports:
      - "2223:22"
    networks:
      - ctf_net2

networks:
  ctf_net2:
    driver: bridge
    name: ctf_net2
